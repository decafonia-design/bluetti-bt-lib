# Publishes the 3deca.com website (3deca-website/public) with GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions",
# then set the custom domain to www.3deca.com and tick "Enforce HTTPS".
name: Publish 3deca.com

on:
  push:
    branches: [ha-deployment]
    paths: ["3deca-website/public/**", ".github/workflows/pages-3deca.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 3deca-website/public
      - id: deployment
        uses: actions/deploy-pages@v4
